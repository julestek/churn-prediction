[project]
name = "churn-prediction"
version = "0.1.0"
description = "Pipeline de prédiction du churn client"
authors = [
    {name = "Roulleau jules.roulleau@gmail.com"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (<3)",
    "numpy (<2.4)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "kaggle (>=2.2.4,<3.0.0)",
    "mlflow (>=3.15.1,<4.0.0)",
    "xgboost (>=3.4.0,<4.0.0)",
    "llvmlite (>=0.44)",
    "numba (>=0.61)",
    "shap (>=0.52.0,<0.53.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
