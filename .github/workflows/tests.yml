name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Poetry
        run: pip install poetry

      - name: Installer les dépendances
        run: poetry install --no-interaction --no-root

      - name: Télécharger le dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          poetry run kaggle datasets download -d blastchar/telco-customer-churn -p data/ --unzip

      - name: Entraîner le modèle
        run: poetry run python -m src.train

      - name: Lancer les tests
        run: poetry run pytest